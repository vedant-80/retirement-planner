_ > nanoagent.plugin.v0001.ManifestConfig:
id: retirement-planner
name: Retirement Age Calculator
version: 0.2.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: []

tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  calculate_retirement:
    description: Find the earliest retirement age using the fixed 4% rule. Ask for current age, investments, annual take-home income, and annual expenses if missing; never invent personal facts. Pass null for unspecified optional rates. The tool computes the result; do not calculate years manually.

tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  project-retirement:
    description: Find the earliest retirement age using the fixed 4% rule. Ask for current age, investments, annual take-home income, and annual expenses if missing; never invent personal facts. Pass null for unspecified optional rates. The tool computes the result; do not calculate years manually.
    runner: tool
    tools: [calculate_retirement]
    reference: null
    instructions: Use custom inputs, not scenario IDs. Check investments >= 25 times inflated annual expenses at each age, now through 100. Default nominal return is 9%, wage growth 2%, and spending inflation 2%. Reject starting ages >=100. Python performs the full projection and returns a compact summary.
