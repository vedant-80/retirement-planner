_ > nanoagent.plugin.v0001.ManifestConfig:
id: retirement-planner
name: Retirement Sustainability Planner
version: 0.1.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: []

tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  get_account_balances:
    description: Retrieve starting cash, tax-deferred and tax-free balances
  get_assumptions:
    description: Retrieve spending, pension, inflation, returns and minimum withdrawal assumptions
  get_tax_schedule:
    description: Retrieve the scenario fictional progressive tax brackets
  get_rules:
    description: Retrieve annual event order, withdrawal priority, tax and rounding rules

tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  project-retirement:
    description: Retirement Sustainability Planner
    runner: agent
    tools: [get_account_balances, get_assumptions, get_tax_schedule, get_rules]
    reference: null
    instructions: |-
      Retrieve all scenario data and rules. Project the requested years (integer 1 to 60) using the prescribed withdrawal order. Submit every year through the horizon or first shortfall, including tax, withdrawals, growth, surplus and ending balances. This is a deterministic sustainability projection, not a globally tax-optimal strategy. See RetirementOutput for all required fields.
