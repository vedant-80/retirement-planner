[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoagent-retirement-planner"
version = "0.2.0"
description = "Retirement Age Calculator: a deterministic NanoAgent task"
requires-python = ">=3.12"
dependencies = ["mcp>=1.27,<2", "slimconfig"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
slimconfig = { git = "https://github.com/zeyuyang8/slimconfig", branch = "master" }

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
